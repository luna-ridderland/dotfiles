include ~/.config/HyprV/kitty/mocha.conf
#font_family      jetbrains mono nerd font
#font_family Fira Code
#font_size        15
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
#cursor_shape     beam
# url_color        #0087bd
url_style        dotted
#Close the terminal without confirmation
confirm_os_window_close 0

shell fish
enable_audio_bell no
# BEGIN_KITTY_THEME

include celeste-theme.conf
# END_KITTY_THEME

#map normal cursor block
#map insert cursor line
