# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# programs
$terminal = kitty
$browser = firefox
$editor = code
$filemanager = nautilus

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal  #open the terminal
bind = $mainMod, F4, killactive, # close the active window
bind = $mainMod, L, exec, swaylock # Lock the screen
bind = $mainMod, M, exec, wlogout --protocol layer-shell # show the logout window
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mainMod, E, exec, $filemanager # Show the graphical file browser
bind = $mainMod, V, togglefloating, # Allow a window to float
bind = $mainMod, SPACE, exec, wofi # Show the graphical app launcher
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod SHIFT, S, exec, hyprshot -m region --clipboard-only # take a screenshot

bind = ALT, V, exec, cliphist list | wofi -dmenu | cliphist decode | wl-copy # open clipboard manager
#bind = $mainMod, T, exec, ~/.config/HyprV/hyprv_util vswitch # switch HyprV version
bind = $mainMod, F, exec, $browser # open the web browser
bind = $mainMod, C, exec, $editor # open the code editor
bind = $mainMod, W, exec, killall waybar || waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch windows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/swworkspace 1 
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/swworkspace 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/swworkspace 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/swworkspace 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/swworkspace 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/swworkspace 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/swworkspace 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/swworkspace 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/swworkspace 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/swworkspace 10

# Switch monitor for workspace
# todo: make a script with swww for this switch as well
bind = $mainMod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec,  ~/.config/hypr/scripts/mtworkspace 1
bind = $mainMod SHIFT, 2, exec,  ~/.config/hypr/scripts/mtworkspace 2
bind = $mainMod SHIFT, 3, exec,  ~/.config/hypr/scripts/mtworkspace 3
bind = $mainMod SHIFT, 4, exec,  ~/.config/hypr/scripts/mtworkspace 4
bind = $mainMod SHIFT, 5, exec,  ~/.config/hypr/scripts/mtworkspace 5
bind = $mainMod SHIFT, 6, exec,  ~/.config/hypr/scripts/mtworkspace 6
bind = $mainMod SHIFT, 7, exec,  ~/.config/hypr/scripts/mtworkspace 7
bind = $mainMod SHIFT, 8, exec,  ~/.config/hypr/scripts/mtworkspace 8
bind = $mainMod SHIFT, 9, exec,  ~/.config/hypr/scripts/mtworkspace 9
bind = $mainMod SHIFT, 0, exec,  ~/.config/hypr/scripts/mtworkspace 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1



# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,